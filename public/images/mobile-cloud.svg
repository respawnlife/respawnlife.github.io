<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#fef7f0"/>
  
  <!-- Left Mobile Device -->
  <rect x="120" y="100" width="100" height="180" rx="20" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/>
  <rect x="130" y="120" width="80" height="140" fill="#c7d2fe"/>
  <rect x="160" y="170" width="20" height="30" fill="#4f46e5"/>
  <circle cx="170" cy="230" r="10" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
  
  <!-- Right Mobile Device -->
  <rect x="380" y="120" width="80" height="150" rx="15" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/>
  <rect x="385" y="140" width="60" height="110" fill="#c7d2fe"/>
  <rect x="405" y="170" width="15" height="20" fill="#4f46e5"/>
  <circle cx="412" cy="210" r="8" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
  
  <!-- Center Cloud -->
  <path d="M260,200 C260,170 285,150 300,150 C315,150 340,170 340,200 C370,200 390,220 390,250 C390,280 365,300 340,300 C340,330 315,350 290,350 C265,350 240,330 240,300 C210,300 190,280 190,250 C190,225 215,200 260,200 Z" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="4"/>
  <circle cx="240" cy="250" r="20" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="340" cy="250" r="20" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  
  <!-- Connection Lines -->
  <line x1="220" y1="190" x2="240" y2="240" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="420" y1="200" x2="360" y2="240" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Title -->
  <text x="300" y="360" text-anchor="middle" font-family="Arial" font-size="24" fill="#1e293b">Mobile &amp; Cloud</text>
</svg>
