<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f0fdfa"/>
  
  <!-- Central Building Icon -->
  <rect x="250" y="150" width="100" height="120" fill="#a7f3d0" stroke="#14b8a6" stroke-width="4"/>
  <rect x="260" y="120" width="80" height="30" fill="#7dd3fc" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="270" y="160" width="20" height="20" fill="#14b8a6"/>
  <rect x="295" y="160" width="20" height="20" fill="#14b8a6"/>
  <rect x="320" y="160" width="20" height="20" fill="#14b8a6"/>
  <rect x="270" y="190" width="20" height="20" fill="#14b8a6"/>
  <rect x="295" y="190" width="20" height="20" fill="#14b8a6"/>
  <rect x="320" y="190" width="20" height="20" fill="#14b8a6"/>
  <rect x="270" y="220" width="20" height="20" fill="#14b8a6"/>
  <rect x="295" y="220" width="20" height="20" fill="#14b8a6"/>
  <rect x="320" y="220" width="20" height="20" fill="#14b8a6"/>
  
  <!-- Left Server Rack -->
  <rect x="120" y="150" width="80" height="120" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="4"/>
  <rect x="130" y="160" width="60" height="15" fill="#c4b5fd"/>
  <rect x="130" y="180" width="60" height="15" fill="#c4b5fd"/>
  <rect x="130" y="200" width="60" height="15" fill="#c4b5fd"/>
  <rect x="130" y="220" width="60" height="15" fill="#c4b5fd"/>
  <rect x="130" y="240" width="60" height="15" fill="#c4b5fd"/>
  
  <!-- Right Security Shield -->
  <path d="M400,150 L450,120 L500,150 L500,270 C500,310 450,380 300,380 C150,380 100,310 100,270 L100,150 L150,120 L200,150" fill="#fde68a" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="300" cy="250" r="40" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <path d="M300,220 L300,260 M300,260 L280,280" stroke="#f59e0b" stroke-width="6" fill="none"/>
  
  <!-- Title -->
  <text x="300" y="360" text-anchor="middle" font-family="Arial" font-size="24" fill="#1e293b">Enterprise Solutions</text>
</svg>
