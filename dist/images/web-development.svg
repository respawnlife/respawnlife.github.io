<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f0f9ff"/>
  
  <!-- Computer Screen -->
  <rect x="100" y="80" width="400" height="250" rx="10" fill="#e0f2fe" stroke="#4f46e5" stroke-width="4"/>
  <rect x="120" y="110" width="360" height="200" fill="#dbeafe"/>
  
  <!-- Code Lines -->
  <rect x="140" y="130" width="200" height="15" fill="#4f46e5" opacity="0.7"/>
  <rect x="140" y="155" width="180" height="15" fill="#4f46e5" opacity="0.7"/>
  <rect x="140" y="180" width="220" height="15" fill="#4f46e5" opacity="0.7"/>
  <rect x="140" y="205" width="160" height="15" fill="#4f46e5" opacity="0.7"/>
  <rect x="140" y="230" width="190" height="15" fill="#4f46e5" opacity="0.7"/>
  <rect x="140" y="255" width="210" height="15" fill="#4f46e5" opacity="0.7"/>
  
  <!-- Browser Tab -->
  <rect x="100" y="60" width="400" height="20" rx="5" fill="#4f46e5"/>
  <circle cx="115" cy="70" r="4" fill="#ec4899"/>
  <circle cx="130" cy="70" r="4" fill="#10b981"/>
  <circle cx="145" cy="70" r="4" fill="#f59e0b"/>
  
  <!-- Title -->
  <text x="300" y="360" text-anchor="middle" font-family="Arial" font-size="24" fill="#1e293b">Web Development</text>
</svg>
